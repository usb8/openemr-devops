# Use admin/pass as user/password credentials to login to openemr (from OE_USER and OE_PASS below)
# MYSQL_HOST and MYSQL_ROOT_PASS are required for openemr
# MYSQL_USER, MYSQL_PASS, OE_USER, MYSQL_PASS are optional for openemr and
#   if not provided, then default to openemr, openemr, admin, and pass respectively.
#
# NOTE need to change command from mysqld to mariadbd when update to mariadb 11.4
#
version: '3.1'
services:
  mysql-1:
    restart: always
    image: mariadb:10.11
    container_name: mysql-1
    command: [
      'mysqld',
      '--character-set-server=utf8mb4',
      '--server-id=1',
      '--log-bin=mysql-bin',
      '--binlog-format=row',
      '--gtid-strict-mode=ON',
      '--log-slave-updates=ON'
    ]
    volumes:
    - databasevolume-1:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
  openemr-1:
    restart: always
    image: openemr/openemr:7.0.2
    container_name: openemr-1
    ports:
    - 81:80
    - 441:443
    volumes:
    - logvolume01-1:/var/log
    - sitevolume-1:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql-1
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
    - mysql-1

  mysql-2:
    restart: always
    image: mariadb:10.11
    container_name: mysql-2
    command: [
      'mysqld',
      '--character-set-server=utf8mb4',
      '--server-id=2',
      '--log-bin=mysql-bin',
      '--binlog-format=row',
      '--gtid-strict-mode=ON',
      '--log-slave-updates=ON'
    ]
    volumes:
    - databasevolume-2:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      # MYSQL_DATABASE: openemr
      # MYSQL_USER: root
      # MYSQL_PASSWORD: root
  openemr-2:
    restart: always
    image: openemr/openemr:7.0.2
    container_name: openemr-2
    ports:
    - 82:80
    - 442:443
    volumes:
    - logvolume01-2:/var/log
    - sitevolume-2:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql-2
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
    - mysql-2

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka-1:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka-1
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "9092:9092"

  kafka-2:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka-2
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "9093:9093"

  kafka-3:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka-3
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "9094:9094"

  kafka-connect:
    image: debezium/connect:2.4
    container_name: kafka-connect
    restart: always
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9094
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"

volumes:
  logvolume01-1: {}
  sitevolume-1: {}
  databasevolume-1: {}
  logvolume01-2: {}
  sitevolume-2: {}
  databasevolume-2: {}
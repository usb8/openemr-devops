# note the service always directs to the primary (and not the replica, which if allowed
#  would break horribly since replicas are just set for mariadb replication) via the selector
apiVersion: v1
kind: Service
metadata:
  name: hospital-2-mysql
  labels:
    app: hospital-2-mysql
spec:
  ports:
  - port: 3306
    name: hospital-2-mysql-port
  # - protocol: TCP
  #   port: 9104
  #   targetPort: 9104
  #   name: metrics
  clusterIP: None
  selector:
    statefulset.kubernetes.io/pod-name: hospital-2-mysql-sts-0
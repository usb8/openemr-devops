apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hospital-2-redis
spec:
  serviceName: hospital-2-redis
  replicas: 3
  selector:
    matchLabels:
      app: hospital-2-redis
  template:
    metadata:
      labels:
        app: hospital-2-redis
    spec:
      initContainers:
      - name: config
        image: redis:alpine
        command: [ "sh", "-c" ]
        args:
          - |
            echo "Copying configuration file"
            cp /tmp/redis/redis.conf /etc/redis/redis.conf
            if [ "$(redis-cli -h hospital-2-sentinel -p 5000 ping)" != "PONG" ]; then
              echo "Sentinel not found, defaulting to hospital-2-redis-0"
              if [ "$(hostname)" == "hospital-2-redis-0" ]; then
                echo "This is hospital-2-redis-0, no update needed."
              else
                echo "Not the primary; updating redis.conf with master FQDN"
                MASTER_FQDN=`hostname  -f | sed -e 's/hospital-2-redis-[0-9]\./hospital-2-redis-0./'`
                echo "REPLICAOF $MASTER_FQDN 6379" >> /etc/redis/redis.conf
              fi
            else
              echo "Sentinel found, retrieving master"
              MASTER="$(redis-cli -h hospital-2-sentinel -p 5000 sentinel get-master-addr-by-name mymaster | grep -E '(^hospital-2-redis-[0-9]+)|([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})')"
              echo "Master is: $MASTER, updating redis.conf"
              echo "REPLICAOF $MASTER 6379" >> /etc/redis/redis.conf
            fi
        volumeMounts:
        - name: hospital-2-redis-config
          mountPath: /etc/redis/
        - name: hospital-2-config
          mountPath: /tmp/redis/
      containers:
      - name: hospital-2-redis
        image: redis:alpine
        command: ["redis-server"]
        args: ["/etc/redis/redis.conf"]
        ports:
        - containerPort: 6379
          name: hospital-2-redis
        volumeMounts:
        - name: hospital-2-redis-config
          mountPath: /etc/redis/
        - name: hospital-2-config-acl
          mountPath: /conf/acl/
      volumes:
      - name: hospital-2-redis-config
        emptyDir: {}
      - name: hospital-2-config
        configMap:
          name: hospital-2-redis-config
      - name: hospital-2-config-acl
        configMap:
          name: hospital-2-redis-acl
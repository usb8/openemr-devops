apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-2-sts
spec:
  serviceName: "mysql-2"
  replicas: 1
  selector:
    matchLabels:
      app: mysql-2
  template:
    metadata:
      labels:
        app: mysql-2
    spec:
      initContainers:
      - name: init-mysql-2
        args:
        - mysqld
        - --character-set-server=utf8mb4
        image: mariadb:10.6
        command:
        - bash
        - "-c"
        - |
          set -ex
          echo 'Starting init-mysql-2';
          ls /mnt/config-map
          [[ `hostname` =~ -([0-9]+)$ ]] || exit 1
          ordinal=${BASH_REMATCH[1]}
          if [[ $ordinal -eq 0 ]]; then
            cp /mnt/config-map/primary.cnf /etc/mysql/conf.d/server-id.cnf
            cp /mnt/config-map/primary.sql /docker-entrypoint-initdb.d
          else
            cp /mnt/config-map/replica.cnf /etc/mysql/conf.d/server-id.cnf
            cp /mnt/config-map/secondary.sql /docker-entrypoint-initdb.d
          fi
          echo server-id=$((3000 + $ordinal)) >> /etc/mysql/conf.d/server-id.cnf
          ls /etc/mysql/conf.d/
          cat /etc/mysql/conf.d/server-id.cnf
        volumeMounts:
          - name: mysql-2-config-map
            mountPath: /mnt/config-map
          - name: mysql-2-config
            mountPath: /etc/mysql/conf.d/
          - name: initdb
            mountPath: /docker-entrypoint-initdb.d
      containers:
      - name: mysql-2
        args:
        - mysqld
        - --character-set-server=utf8mb4
        image: mariadb:10.6
        ports:
        - containerPort: 3306
          name: mysql-port
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-2-credentials
              key: password
        - name: MYSQL_INITDB_SKIP_TZINFO
          value: "1"
        volumeMounts:
        - name: mysql-2-server-certs
          mountPath: /etc/mysql/ssl/main/
        - name: mysql-2-replication-certs
          mountPath: /etc/mysql/ssl/replication/
        - name: mysql-2-datadir
          mountPath: /var/lib/mysql/
        - name: mysql-2-config
          mountPath: /etc/mysql/conf.d/
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mysql-2-server-certs
        secret:
          secretName: mysql-server-certs  # reuse same cert secret or create an independent one
          items:
          - key: ca.crt
            path: ca.crt
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: mysql-2-replication-certs
        secret:
          secretName: mysql-replication-certs
          items:
          - key: ca.crt
            path: ca.crt
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: mysql-2-config-map
        configMap:
          name: mysql-2-configmap
      - name: mysql-2-config
        emptyDir: {}
      - name: initdb
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: mysql-2-datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
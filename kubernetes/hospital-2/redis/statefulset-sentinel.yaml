apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hospital-2-sentinel
spec:
  serviceName: hospital-2-sentinel
  replicas: 3
  selector:
    matchLabels:
      app: hospital-2-sentinel
  template:
    metadata:
      labels:
        app: hospital-2-sentinel
    spec:
      initContainers:
      - name: config
        image: redis:alpine
        command: [ "sh", "-c" ]
        args:
          - |
            REDIS_PASSWORD=adminpassword
            nodes=hospital-2-redis-0.hospital-2-redis,hospital-2-redis-1.hospital-2-redis,hospital-2-redis-2.hospital-2-redis
            echo "Looping through the redis list to see if Redis Master node is available now"
            while [ 1 ]
            do
                for i in ${nodes//,/ }
                do
                    MASTER=$(redis-cli --no-auth-warning --raw -h $i --user admin -a $REDIS_PASSWORD info replication | awk '{print $1}' | grep master_host: | cut -d ":" -f2)
                    if [ "$MASTER" == "" ]; then
                        echo "no master info found in $i"
                        MASTER=
                    else
                        echo "found $MASTER. setting the configurations"
                        break
                    fi
                done
                if [ "$MASTER" == "" ]; then
                    echo "no master info found yet, wait 10 seconds before trying again"
                    sleep 10
                else
                    echo "again, found $MASTER, so setting the configurations"
                    break
                fi
            done
            echo "Creating Sentinel configuration file"
            echo "port 5000
            sentinel monitor mymaster $MASTER 6379 2
            sentinel resolve-hostnames yes
            sentinel announce-hostnames yes
            sentinel down-after-milliseconds mymaster 5000
            sentinel failover-timeout mymaster 60000
            sentinel parallel-syncs mymaster 1
            sentinel auth-user mymaster admin
            sentinel auth-pass mymaster $REDIS_PASSWORD
            " > /etc/redis/sentinel.conf
            cat /etc/redis/sentinel.conf
        volumeMounts:
        - name: hospital-2-redis-config
          mountPath: /etc/redis/
      containers:
      - name: hospital-2-sentinel
        image: redis:alpine
        command: ["redis-sentinel"]
        args: ["/etc/redis/sentinel.conf"]
        ports:
        - containerPort: 5000
          name: sentinel
        volumeMounts:
        - name: hospital-2-redis-config
          mountPath: /etc/redis/
        - name: hospital-2-data
          mountPath: /data
      volumes:
      - name: hospital-2-redis-config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: hospital-2-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Mi